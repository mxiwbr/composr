[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "composr"
version = "0.0.0"
dependencies = [
    "blessed",
    "pyyaml",
    "regex"
]

[project.optional-dependencies]
dev = [
    "Babel"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
composr = ["locale/**/*.mo"]